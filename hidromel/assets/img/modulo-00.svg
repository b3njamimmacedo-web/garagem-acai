<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">

<defs>
  <pattern id="fvt" width="39.00" height="45.03" patternUnits="userSpaceOnUse">
    <polygon points="26.00,0.00 13.00,22.52 -13.00,22.52 -26.00,0.00 -13.00,-22.52 13.00,-22.52" fill="none" stroke="#D4A017" stroke-opacity="0.09" stroke-width="1.2"/>
    <polygon points="26.00,45.03 13.00,67.55 -13.00,67.55 -26.00,45.03 -13.00,22.52 13.00,22.52" fill="none" stroke="#D4A017" stroke-opacity="0.09" stroke-width="1.2"/>
    <polygon points="65.00,22.52 52.00,45.03 26.00,45.03 13.00,22.52 26.00,0.00 52.00,0.00" fill="none" stroke="#D4A017" stroke-opacity="0.09" stroke-width="1.2"/>
    <polygon points="26.00,22.52 13.00,45.03 -13.00,45.03 -26.00,22.52 -13.00,0.00 13.00,0.00" fill="none" stroke="#D4A017" stroke-opacity="0.045" stroke-width="1.2"/>
  </pattern>
  <filter id="gru" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
    <feComponentTransfer in="ng" result="nt"><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="nt" mode="multiply"/>
  </filter>
  <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#7A5E14"/>
    <stop offset="18%"  stop-color="#D4A017"/>
    <stop offset="38%"  stop-color="#FBE08A"/>
    <stop offset="52%"  stop-color="#F5C542"/>
    <stop offset="70%"  stop-color="#B8860B"/>
    <stop offset="88%"  stop-color="#6F5411"/>
    <stop offset="100%" stop-color="#A87D18"/>
  </linearGradient>
  <linearGradient id="gty" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FBE08A"/>
    <stop offset="40%"  stop-color="#F5C542"/>
    <stop offset="75%"  stop-color="#D4A017"/>
    <stop offset="100%" stop-color="#A87D18"/>
  </linearGradient>
  <radialGradient id="brw" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#D4A017" stop-opacity="0.75"/>
    <stop offset="55%"  stop-color="#D4A017" stop-opacity="0.1875"/>
    <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#D4A017" stop-opacity="0.30"/>
    <stop offset="45%"  stop-color="#171009"/>
    <stop offset="100%" stop-color="#0E0B08"/>
  </linearGradient>
</defs>
<rect width="480" height="300" fill="#0E0B08"/>
<rect width="480" height="300" fill="url(#fx)"/>
<rect width="480" height="300" fill="url(#fvt)"/>
<ellipse cx="150" cy="150" rx="190" ry="170" fill="url(#brw)" opacity="0.5"/>


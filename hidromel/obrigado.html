<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quase lá — Hidromel de Reis</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0B08">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/site.css">
<style>
  .obrigado { min-height: 100svh; display: grid; place-items: center; padding: 2.5rem 1.2rem; }
  .caixa {
    width: min(100%, 540px);
    background: linear-gradient(165deg, rgba(31,22,13,.96), rgba(14,11,8,.99));
    border: var(--borda-forte); border-radius: var(--raio-g);
    padding: clamp(1.6rem, 5vw, 2.6rem); box-shadow: var(--sombra); text-align: center;
  }
  .caixa img.marca { width: 70px; margin: 0 auto 1.3rem; }
  .qr {
    background: #fff; padding: 12px; border-radius: 8px;
    width: 240px; margin: 1.4rem auto; display: block;
  }
  .qr-vazio {
    width: 240px; aspect-ratio: 1; margin: 1.4rem auto; display: grid; place-items: center;
    border: 1px dashed rgba(212,160,23,.4); border-radius: 8px;
    color: var(--fumaca); font-size: .85rem; padding: 1rem; text-align: center;
  }
  .copia {
    display: flex; gap: .5rem; margin: 1rem 0;
  }
  .copia input {
    flex: 1; min-width: 0; padding: .75rem .9rem; font-size: .8rem;
    font-family: ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,.5); color: var(--pergaminho-2);
    border: var(--borda); border-radius: var(--raio);
  }
  .copia button { padding: .75rem 1.1rem; white-space: nowrap; }
  .passos { text-align: left; display: grid; gap: .7rem; margin: 1.6rem 0; }
  .passo { display: flex; gap: .8rem; font-size: .9rem; align-items: flex-start; }
  .passo b {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    background: rgba(212,160,23,.15); border: 1px solid rgba(212,160,23,.4);
    color: var(--ouro-claro); display: grid; place-items: center; font-size: .78rem;
  }
  .aguardando {
    display: flex; align-items: center; justify-content: center; gap: .7rem;
    font-size: .9rem; color: var(--fumaca); margin-top: 1.2rem;
  }
  .ponto {
    width: 9px; height: 9px; border-radius: 50%; background: var(--ouro-claro);
    animation: pisca 1.3s ease-in-out infinite;
  }
  @keyframes pisca { 50% { opacity: .15; transform: scale(.65); } }
  .credencial {
    background: rgba(0,0,0,.45); border: var(--borda-forte); border-radius: var(--raio);
    padding: 1.2rem; margin: 1.4rem 0;
  }
  .credencial .rot { font-size: .68rem; letter-spacing: .2em; color: var(--ouro); margin-bottom: .5rem; }
  .credencial code {
    font-family: ui-monospace, Menlo, monospace; font-size: 1.15rem;
    color: var(--ouro-claro); letter-spacing: .12em; font-weight: 700; word-break: break-all;
  }
  .contagem { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="obrigado">
  <div class="caixa" id="caixa">
    <img class="marca" src="./assets/img/logo.svg" alt="Hidromel de Reis" width="70">
    <p class="mini">Carregando…</p>
  </div>
</div>

<script type="module">
import * as API from './assets/js/api.js';
import { CONFIG, MODO_DEMO } from './assets/js/config.js';

const caixa = document.getElementById('caixa');
const params = new URLSearchParams(location.search);
const pedidoId = params.get('p');
const guardado = (() => {
  try { return JSON.parse(sessionStorage.getItem('hdr_pix') || 'null'); }
  catch { return null; }
})();

const marca = `<img class="marca" src="./assets/img/logo.svg" alt="Hidromel de Reis" width="70">`;

/* ------------------------------------------------------------ APROVADO */
function telaAprovado(r) {
  clearInterval(intervalo);
  API.evento('Purchase', {
    value: guardado?.valor || 0, currency: 'BRL',
    content_name: 'Hidromel de Reis',
  });

  caixa.innerHTML = `
    ${marca}
    <span class="sobrescrito">Pagamento aprovado</span>
    <h1 style="font-size:1.8rem;margin:.6rem 0 1rem">Bem-vindo à Ordem</h1>
    <p>Seu acesso está liberado. Enviamos tudo para
       <strong>${r.email || guardado?.email || 'seu e-mail'}</strong> — confira também
       a caixa de promoções e o spam.</p>

    <div class="credencial">
      <div class="rot">SEU CÓDIGO DE ACESSO PESSOAL</div>
      <code id="cod">${r.codigo}</code>
      <div style="margin-top:.8rem">
        <button class="btn btn-linha" id="copiarCod" style="padding:.5rem 1rem;font-size:.78rem">
          Copiar código
        </button>
      </div>
    </div>

    <a class="btn btn-ouro btn-bloco btn-g" href="${r.link || './curso/'}">Entrar no curso agora</a>

    <p class="mini" style="margin-top:1.2rem">
      Anote este código. Ele é único, pessoal e serve para entrar de qualquer
      aparelho — sempre junto com o e-mail da compra.
    </p>`;

  document.getElementById('copiarCod')?.addEventListener('click', (e) => {
    navigator.clipboard?.writeText(r.codigo);
    e.target.textContent = 'Copiado ✓';
  });
}

/* --------------------------------------------------------- PIX PENDENTE */
function telaPix(dados) {
  const qr = dados.qrBase64
    ? `<img class="qr" src="data:image/png;base64,${dados.qrBase64}" alt="QR Code do Pix" width="240">`
    : `<div class="qr-vazio">${dados.demo
        ? 'Modo demonstração — nenhum QR real é gerado. A aprovação é simulada em 8 segundos.'
        : 'QR não disponível. Use o código copia e cola abaixo.'}</div>`;

  caixa.innerHTML = `
    ${marca}
    <span class="sobrescrito">Falta só o pagamento</span>
    <h1 style="font-size:1.6rem;margin:.6rem 0 .8rem">Pague o Pix e entre na hora</h1>
    <p class="mini">O acesso é liberado automaticamente assim que o pagamento cair.
       Não feche esta página.</p>

    ${qr}

    <div class="copia">
      <input id="copiaCola" readonly value="${dados.copiaCola || ''}">
      <button class="btn btn-ouro" id="btnCopiar">Copiar</button>
    </div>

    <div class="passos">
      <div class="passo"><b>1</b><span>Abra o app do seu banco e escolha <strong>Pix Copia e Cola</strong>
        (ou aponte a câmera para o QR).</span></div>
      <div class="passo"><b>2</b><span>Confira o valor e confirme.</span></div>
      <div class="passo"><b>3</b><span>Volte para cá — esta página se atualiza sozinha
        e mostra seu código de acesso.</span></div>
    </div>

    <div class="aguardando">
      <span class="ponto"></span>
      <span>Aguardando o pagamento<span class="contagem" id="expira"></span></span>
    </div>`;

  document.getElementById('btnCopiar').addEventListener('click', (e) => {
    const el = document.getElementById('copiaCola');
    el.select();
    navigator.clipboard?.writeText(el.value).catch(() => document.execCommand('copy'));
    e.target.textContent = 'Copiado ✓';
    setTimeout(() => { e.target.textContent = 'Copiar'; }, 2200);
  });

  if (dados.expiraEm) contarExpiracao(new Date(dados.expiraEm).getTime());
}

function contarExpiracao(fim) {
  const el = () => document.getElementById('expira');
  const tick = () => {
    const alvo = el();
    if (!alvo) return;
    const resta = fim - Date.now();
    if (resta <= 0) { alvo.textContent = ' — código expirado'; return; }
    const m = Math.floor(resta / 60000), s = Math.floor(resta / 1000) % 60;
    alvo.textContent = ` · expira em ${m}:${String(s).padStart(2, '0')}`;
  };
  tick();
  setInterval(tick, 1000);
}

/* ------------------------------------------------------------- ERRO */
function telaErro(msg) {
  clearInterval(intervalo);
  caixa.innerHTML = `
    ${marca}
    <h1 style="font-size:1.5rem;margin-bottom:.8rem">Não localizei este pedido</h1>
    <p class="mini">${msg}</p>
    <p class="mini" style="margin-top:1.2rem">
      Se o pagamento já saiu da sua conta, escreva para
      <a href="mailto:${CONFIG.EMAIL_SUPORTE}">${CONFIG.EMAIL_SUPORTE}</a>
      com o comprovante — resolvemos manualmente e liberamos seu acesso.
    </p>
    <a class="btn btn-linha btn-bloco" href="./" style="margin-top:1.4rem">Voltar ao site</a>`;
}

/* ------------------------------------------------------- ACOMPANHAMENTO */
let intervalo = null;
let tentativas = 0;

async function verificar() {
  if (!pedidoId) return telaErro('Pedido não informado no endereço.');
  try {
    const r = await API.consultarPedido(pedidoId);
    if (r.status === 'aprovado') { telaAprovado(r); return; }
    tentativas++;
    // Depois de ~20 min sem aprovação, para de consultar. Sem esse limite a
    // aba fica batendo no servidor para sempre se o cliente esquecê-la aberta.
    if (tentativas > 240) {
      clearInterval(intervalo);
      const aguardando = document.querySelector('.aguardando');
      if (aguardando) {
        aguardando.innerHTML =
          `<span>Parei de verificar. <a href="" onclick="location.reload();return false">Clique aqui</a>
           se você já pagou.</span>`;
      }
    }
  } catch (e) {
    if (e.status === 404) { clearInterval(intervalo); telaErro(e.message); }
    // outros erros: pode ser rede instável — continua tentando
  }
}

(async function iniciar() {
  if (!pedidoId && params.get('demo')) {
    // volta do checkout de cartão em modo demonstração
    telaAprovado({ codigo: 'MEAD-DEMO-2026-REIS', link: './curso/#/entrar?c=MEAD-DEMO-2026-REIS' });
    return;
  }
  if (!pedidoId) return telaErro('Endereço sem identificador de pedido.');

  if (guardado && guardado.pedidoId === pedidoId) telaPix(guardado);
  else {
    caixa.innerHTML = `${marca}<p class="mini">Verificando seu pagamento…</p>
      <div class="aguardando"><span class="ponto"></span><span id="expira"></span></div>`;
  }

  await verificar();
  intervalo = setInterval(verificar, 5000);
})();

if (MODO_DEMO) {
  const aviso = document.createElement('div');
  aviso.style.cssText =
    'position:fixed;left:0;right:0;top:0;z-index:200;background:#6B1F2A;color:#F3E9D2;' +
    'font:600 12px/1.5 system-ui,sans-serif;text-align:center;padding:5px 10px';
  aviso.textContent = 'MODO DEMONSTRAÇÃO — pagamento simulado, aprova sozinho em 8 segundos.';
  document.body.appendChild(aviso);
}
</script>
</body>
</html>
